name: Publish package

# Publishes @darkwalletrh/dark-sdk to GitHub Packages when a release tag (v1.2.3) is pushed.
# Uses the workflow's own GITHUB_TOKEN, so no personal token is involved. Installing from a tag
# with `npm install github:DarkWalletRH/dark-sdk#v1.2.3` works without any of this.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@darkwalletrh"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
