name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      # The prepare script builds dist/ during install; the explicit build below fails loudly on a type error.
      - run: npm ci
      - run: npm run build
      # Prover tests skip themselves: nargo, bb and the Noir workspace live in dark-contracts.
      - run: npm test
